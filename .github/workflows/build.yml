name: Build ImmortalWrt

on:
  push:
    branches:
      - tenda-be12-pro
  workflow_dispatch: # 允许手动在网页触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ENABLE_ISTORE: "true"
      ISTORE_FEED_REPO: "https://github.com/linkease/istore"
      ISTORE_FEED_REF: "main"
      ISTORE_PACKAGE: "luci-app-store"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "1500M"
      CCACHE_BASEDIR: ${{ github.workspace }}
    
    steps:
      - name: Checkout My Repository Source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 获取完整历史，方便某些脚本获取版本号（可选）

      - name: Restore Download Cache
        uses: actions/cache@v5
        with:
          path: dl
          key: ${{ runner.os }}-immortalwrt-dl-v1-${{ hashFiles('defconfig/mt7987_mt7992.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-dl-v1-

      - name: Restore Compiler Cache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-immortalwrt-ccache-v1-${{ github.ref_name }}-${{ hashFiles('defconfig/mt7987_mt7992.config') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ccache-v1-${{ github.ref_name }}-${{ hashFiles('defconfig/mt7987_mt7992.config') }}-
            ${{ runner.os }}-immortalwrt-ccache-v1-

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 安装 OpenWrt/ImmortalWrt 构建所需依赖
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Prepare Compiler Cache
        run: |
          set -euo pipefail

          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi

          mkdir -p "${CCACHE_DIR}" dl
          ccache -M "${CCACHE_MAXSIZE}"
          ccache --zero-stats || true
          ccache --show-config | sed -n '1,20p'
      
      - name: Mutate Feeds for iStore
        if: env.ENABLE_ISTORE == 'true'
        run: |
          ISTORE_FEED_LINE="src-git istore ${ISTORE_FEED_REPO};${ISTORE_FEED_REF}"

          if ! grep -qE '^src-git[[:space:]]+istore[[:space:]]' feeds.conf.default; then
            printf '\n%s\n' "$ISTORE_FEED_LINE" >> feeds.conf.default
          fi

          echo "✅ Injected iStore feed:"
          grep -E '^src-git[[:space:]]+istore[[:space:]]' feeds.conf.default


      - name: Update and Install Feeds
        run: |
          # 当前目录已经是源码根目录
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          if [ "${ENABLE_ISTORE}" = "true" ]; then
            ./scripts/feeds install -d y -p istore "${ISTORE_PACKAGE}"
          fi

      - name: Load Configuration (mt7987_mt7992)
        run: |
          set_config() {
            local key="$1"
            local value="$2"

            if grep -q "^# ${key} is not set$" .config; then
              sed -i "s|^# ${key} is not set$|${key}=${value}|" .config
            elif grep -q "^${key}=" .config; then
              sed -i "s|^${key}=.*$|${key}=${value}|" .config
            else
              echo "${key}=${value}" >> .config
            fi
          }

          enable_package() {
            local pkg="$1"

            set_config "CONFIG_PACKAGE_${pkg}" "y"
          }

          # 检查配置文件是否存在
          if [ -f "defconfig/mt7987_mt7992.config" ]; then
            cp -f defconfig/mt7987_mt7992.config .config
            echo "✅ Successfully loaded defconfig/mt7987_mt7992.config"

            set_config "CONFIG_CCACHE" "y"

            if [ "${ENABLE_ISTORE}" = "true" ]; then
              enable_package "${ISTORE_PACKAGE}"
              echo "✅ Enabled ${ISTORE_PACKAGE} in .config"
            fi

            # 执行 make defconfig 以确保配置完整并处理依赖
            make defconfig

            echo "📄 Key build options:"
            grep -E '^(CONFIG_TARGET_|CONFIG_CCACHE=|CONFIG_PACKAGE_luci-app-store=)' .config || true
            
          else
            echo "❌ Error: defconfig/mt7987_mt7992.config not found in defconfig/ directory!"
            ls -R defconfig/
            exit 1
          fi

          # ⭐ 修复 ebtables 下载问题 (镜像站文件哈希不匹配)
          EBTABLES_MAKEFILE="package/network/utils/ebtables/Makefile"
          if [ -f "$EBTABLES_MAKEFILE" ]; then
            echo "🔧 修复 ebtables 下载源和哈希..."
            # 使用 netfilter 官方 GitHub 镜像
            sed -i 's|https://git.netfilter.org/ebtables|https://github.com/netfilter/ebtables.git|g' "$EBTABLES_MAKEFILE"
            sed -i 's|git://git.netfilter.org/ebtables|https://github.com/netfilter/ebtables.git|g' "$EBTABLES_MAKEFILE"
            # 更新哈希值为镜像站实际提供的文件哈希 (解决哈希不匹配问题)
            sed -i 's|PKG_MIRROR_HASH:=.*|PKG_MIRROR_HASH:=skip|g' "$EBTABLES_MAKEFILE"
            echo "✅ ebtables 下载源已修复"
          fi

      - name: Download Sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete

      - name: Compile Firmware
        run: |
          set -euo pipefail

          ccache --show-stats || true

          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed, retrying with -j1 V=s for detailed logs"
            make -j1 V=s
          fi

          ccache --show-stats || true

      - name: Save Compiler Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: mt7987_mt7992-tenda-be12pro-${{ github.run_number }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets found under bin/targets/mediatek/filogic"
            exit 1
          fi

          gh --version

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists, recreating it for this rerun."
            gh release delete "${TAG_NAME}" --cleanup-tag --yes
          fi

          gh release create "${TAG_NAME}" "${assets[@]}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "${TAG_NAME}"

          gh release view "${TAG_NAME}" --json url --jq '.url'
